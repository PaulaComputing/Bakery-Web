spring.application.name=backend
server.port=8080

# Conexión a MySQL (XAMPP por defecto: usuario root y sin contraseña)
spring.datasource.url=jdbc:mysql://localhost:3306/pasteleria_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
spring.datasource.username=root
spring.datasource.password=

# JPA / Hibernate (crea y actualiza las tablas automáticamente)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Ruta de Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html

# Clave secreta JWT (mínimo 32 caracteres) y expiración (24 horas en ms)
jwt.secret=ClaveSecretaSuperSeguraParaPasteleriaDuocFullstack2026!
jwt.expiration=86400000
